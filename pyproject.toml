[project]
name = "autobet-bl"
version = "0.1.0"
description = "AutoBet BL - Bundesliga probability and value detection toolkit"
authors = [{name = "AutoBet BL"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
